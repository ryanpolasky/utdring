name: Webring Health Check

on:
  schedule:
    - cron: "40 13 * * *" # 08:40 America/Chicago
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: webring-health
  cancel-in-progress: true

jobs:
  walk:
    name: Walk the ring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm test

      - name: Walk the webring
        id: walk
        continue-on-error: true
        run: node scripts/check-webring.mjs --report "$RUNNER_TEMP/report.md"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.walk.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: webring-health
          TITLE: "Webring health: some sites need attention"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.md"

          gh label create "$LABEL" --color D93F0B \
            --description "Automated webring health check findings" 2>/dev/null || true

          existing=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$OUTCOME" != "success" ]; then
            {
              if [ -f "$report" ]; then
                cat "$report"
              else
                echo "The health check itself failed to run — see [the run log]($RUN_URL)."
              fi
              echo
              echo "<sub>Updated daily by \`.github/workflows/webring-health.yml\` ([latest run]($RUN_URL)). Closes itself once every site is healthy.</sub>"
            } > "$RUNNER_TEMP/issue.md"

            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every site is healthy again as of [this run]($RUN_URL)."
          fi

      - name: Fail the run if any site is broken
        if: steps.walk.outcome != 'success'
        run: exit 1
