name: Request Reviewer
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions:
  pull-requests: write
jobs:
  request-review:
    if: github.event.pull_request.user.login != 'ryanpolasky'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR" --add-reviewer ryanpolasky
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
